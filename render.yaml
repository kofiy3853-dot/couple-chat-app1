services:
  - type: web
    name: couple-chat-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx tsx src/server/websocket/server.ts & npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: couple-chat-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://couple-chat-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://couple-chat-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: WS_PORT
        value: "3001"
      - key: NEXT_PUBLIC_WS_URL
        value: wss://couple-chat-web.onrender.com

databases:
  - name: couple-chat-db
    plan: free
    databaseName: couple_chat
