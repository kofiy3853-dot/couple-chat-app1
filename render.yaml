services:
  - type: web
    name: couple-chat-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: couple-chat-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://couple-chat-web.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://couple-chat-ws.onrender.com

  - type: web
    name: couple-chat-ws
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run ws
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: couple-chat-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://couple-chat-web.onrender.com
      - key: WS_PORT
        value: "10000"

databases:
  - name: couple-chat-db
    plan: free
    databaseName: couple_chat