services:
  - type: web
    name: couple-chat-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: couple-chat-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://couple-chat-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://couple-chat-web.onrender.com
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: couple-chat-db
    plan: free
    databaseName: couple_chat
